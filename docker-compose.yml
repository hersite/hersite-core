services:
  postgres:
    image: postgres:16
    container_name: riesgo_materno_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: riesgo_materno_db
    ports:
      - "5433:5432"
    volumes:
      - riesgo_materno_postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: riesgo_materno_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hersite.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  riesgo_materno_postgres_data: